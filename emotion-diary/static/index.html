<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดบันทึกอารมณ์ · Wheel of Emotions</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎡 สมุดบันทึก<span>อารมณ์</span></h1>
    <p class="sub">เลือกอารมณ์หยาบๆ ก่อน แล้วค่อยๆ เจาะลึกลงไปทีละชั้น</p>
  </header>

  <!-- STEP 1: core -->
  <section class="card" id="step1">
    <h2>1. ตอนนี้คุณรู้สึกแบบไหน?</h2>
    <div class="grid core-grid" id="coreGrid"></div>
  </section>

  <!-- STEP 2: level2 -->
  <section class="card hidden" id="step2">
    <div class="crumbs" id="crumbs2"></div>
    <h2>2. ลองเจาะลึกอีกนิด...</h2>
    <div class="grid" id="level2Grid"></div>
    <div class="unsureRow">
      <button class="unsureBtn" id="unsureAtCore">🤔 ไม่แน่ใจ รู้แค่นี้พอ บันทึกเลย</button>
    </div>
  </section>

  <!-- STEP 3: level3 -->
  <section class="card hidden" id="step3">
    <div class="crumbs" id="crumbs3"></div>
    <h2>3. เจาะจงแบบสุดๆ (ถ้าพอบอกได้)</h2>
    <div class="grid" id="level3Grid"></div>
    <div class="unsureRow">
      <button class="unsureBtn" id="unsureAtLevel2">🤔 ไม่แน่ใจ แค่นี้พอ บันทึกเลย</button>
    </div>
  </section>

  <!-- STEP 4: write & save -->
  <section class="card hidden" id="step4">
    <div class="crumbs" id="crumbs4"></div>
    <h2>4. อยากเล่าอะไรเพิ่มไหม?</h2>
    <div class="dateRow">
      <label>วันที่ <input type="date" id="entryDate"></label>
      <label>เวลา <input type="time" id="entryTime"></label>
    </div>
    <div class="mdToolbar">
      <button type="button" data-md="bold" title="ตัวหนา"><b>B</b></button>
      <button type="button" data-md="italic" title="ตัวเอียง"><i>I</i></button>
      <button type="button" data-md="h" title="หัวข้อ">H</button>
      <button type="button" data-md="quote" title="คำพูด">&ldquo;</button>
      <button type="button" data-md="ul" title="รายการ">• list</button>
      <button type="button" data-md="ol" title="รายการเลข">1. list</button>
      <button type="button" data-md="code" title="โค้ด">&lt;/&gt;</button>
      <button type="button" data-md="link" title="ลิงก์">🔗</button>
      <span class="mdSpacer"></span>
      <button type="button" id="previewToggle">👁️ ดูตัวอย่าง</button>
    </div>
    <textarea id="entryText" placeholder="เกิดอะไรขึ้น... รองรับ Markdown เช่น **ตัวหนา** *ตัวเอียง* - รายการ (จะเว้นว่างก็ได้)"></textarea>
    <div id="mdPreview" class="md-body hidden"></div>
    <p class="mdHint">รองรับ Markdown: **ตัวหนา**, *ตัวเอียง*, # หัวข้อ, - รายการ, &gt; คำพูด, `โค้ด`, [ลิงก์](url)</p>
    <div class="row">
      <button class="btn primary" id="saveBtn">💾 บันทึกลงไฟล์</button>
      <button class="btn ghost" id="restartBtn">เริ่มใหม่</button>
    </div>
  </section>

  <!-- ENTRIES LIST -->
  <section class="card">
    <h2>📖 บันทึกที่ผ่านมา</h2>
    <div class="stats" id="stats"></div>
    <div id="entries" class="entries"></div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
